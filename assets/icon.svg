<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LLM Chat to Markdown Exporter logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="0.55" stop-color="#5b5bf0"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
  </defs>

  <!-- Badge background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Chat bubble -->
  <g transform="translate(256 156)">
    <rect x="-118" y="-78" width="236" height="150" rx="40" fill="#ffffff"/>
    <path d="M -64 60 L -64 104 L -18 60 Z" fill="#ffffff"/>
    <circle cx="-48" cy="-4" r="15" fill="#1a73e8"/>
    <circle cx="2" cy="-4" r="15" fill="#1a73e8"/>
    <circle cx="52" cy="-4" r="15" fill="#1a73e8"/>
  </g>

  <!-- Down arrow (chat -> doc) -->
  <g stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="256" y1="250" x2="256" y2="300"/>
    <path d="M232 286 L256 312 L280 286"/>
  </g>

  <!-- Markdown document -->
  <g transform="translate(256 384)">
    <rect x="-104" y="-92" width="208" height="184" rx="22" fill="url(#doc)"/>
    <rect x="24" y="-92" width="80" height="40" rx="12" fill="#7c3aed"/>
    <text x="64" y="-62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">.md</text>
    <!-- content lines -->
    <rect x="-78" y="-30" width="156" height="14" rx="7" fill="#c9cef0"/>
    <rect x="-78" y="2" width="120" height="14" rx="7" fill="#dfe3f7"/>
    <rect x="-78" y="34" width="140" height="14" rx="7" fill="#dfe3f7"/>
    <rect x="-78" y="66" width="92" height="14" rx="7" fill="#dfe3f7"/>
  </g>
</svg>
